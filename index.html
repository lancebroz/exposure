<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exposure Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://a.espncdn.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07171F;
  --panel:#0D2532;
  --panel2:#123243;
  --line:#1C4356;
  --line-soft:#143446;
  --text:#E4EFF2;
  --muted:#87A9B7;
  --bar:#7FB2C9;
  --qb:#F2705A;
  --rb:#57C46B;
  --wr:#EFC245;
  --te:#B18CF2;
  --kd:#7C97A6;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--text);
  font-family:'Archivo',ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--bar);outline-offset:2px}

h1{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:0 0 16px;padding-bottom:14px;border-bottom:2px solid var(--line)}
h1 span{color:var(--muted);font-weight:500}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:9px 14px;font-weight:600;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--bar)}

.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.field{background:var(--panel);border:1px solid var(--line-soft);color:var(--text);border-radius:var(--r);padding:8px 11px}
.field::placeholder{color:#5F8494}
.chipbar{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line-soft);color:var(--muted);border-radius:100px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--panel2);color:var(--text);border-color:var(--bar)}
.chip.multi{display:inline-flex;align-items:center;gap:5px}
.tick{color:var(--bar);font-size:11px;line-height:1}
.toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--bar);width:16px;height:16px}

/* ---------- exposure ladder ---------- */
.head-row,.row{
  display:grid;
  grid-template-columns:24px minmax(120px,1fr) 46px 54px 86px 74px 30px;
  grid-template-areas:"rank player pos teams risk bank chev";
  gap:10px;align-items:center;text-align:left;
}
.head-row{color:var(--muted);font-size:12.5px;font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line)}
.head-row button{background:none;border:0;color:inherit;font:inherit;padding:0;text-align:inherit}
.head-row button:hover{color:var(--text)}
.item{border-bottom:1px solid var(--line-soft)}
.row{width:100%;background:none;border:0;padding:10px;font:inherit;text-align:left}
.row:hover{background:#0B2431}
.item.open .row{background:#0B2431}
.c-rank{grid-area:rank;color:#527687;font-size:13px;text-align:right}
.c-player{grid-area:player;display:flex;align-items:center;gap:10px;min-width:0}
.c-pos{grid-area:pos}
.c-teams{grid-area:teams;text-align:right}
.c-risk{grid-area:risk;text-align:right;font-weight:700}
.c-bank{grid-area:bank;text-align:right;color:var(--muted)}
.c-chev{grid-area:chev;text-align:center;color:var(--muted);transition:transform .15s}
.item.open .c-chev{transform:rotate(180deg);color:var(--text)}
.pname{font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.tlogo{object-fit:contain;flex:none}
.tlogo.blank{display:inline-block;border:1px dashed var(--line);border-radius:50%;opacity:.4}
.lbl{display:none;color:var(--muted);font-size:11.5px;font-weight:400}

.pos{font-size:12px;font-weight:700;color:#0A1D26;border-radius:3px;padding:1px 5px;display:inline-block;min-width:31px;text-align:center;background:var(--kd)}
.pos.QB{background:var(--qb)}.pos.RB{background:var(--rb)}.pos.WR{background:var(--wr)}.pos.TE{background:var(--te)}

.detail{display:none;padding:0 12px 14px 44px}
.item.open .detail{display:block}
.leagues{display:flex;gap:6px;flex-wrap:wrap}
.lg{font-size:12.5px;border:1px solid var(--line);border-radius:100px;padding:3px 11px;color:var(--text);background:var(--panel);font-weight:500}
.lg.bench{color:var(--muted);background:transparent;border-style:dashed;font-weight:400}
.dnote{color:var(--muted);font-size:12px;margin:8px 0 0}

/* ---------- breakdown ---------- */
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.split h3{font-size:15px;margin:0 0 12px;font-weight:600}
.brow{display:grid;grid-template-columns:62px 1fr 62px;gap:10px;align-items:center;margin-bottom:8px;font-size:13.5px}
.brow .num{text-align:right;color:var(--muted)}
.bar{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:3px}
.note{color:var(--muted);font-size:12.5px;margin-top:8px;max-width:46ch}

/* ---------- teams ---------- */
#teamList{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.team{border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.team-hd{padding:12px 15px;background:var(--panel)}
.team-hd h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
.team-hd .meta{color:var(--muted);font-size:13px}
.roster{padding:4px 15px 14px}
.slot{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.slot:last-child{border-bottom:0}
.slot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.bn .nm{color:var(--muted)}
.rgroup{color:var(--muted);font-size:12.5px;font-weight:600;margin:12px 0 2px}

/* ---------- takes ---------- */
.take-form{border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;background:var(--panel);margin-bottom:22px}
.take-form .grid{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.take-form input{flex:1;min-width:150px}
textarea{width:100%;min-height:88px;resize:vertical;background:var(--panel2);border:1px solid var(--line-soft);color:var(--text);border-radius:var(--r);padding:10px;line-height:1.55}
.save{margin-top:10px;background:var(--panel2);border:1px solid var(--bar);color:var(--text);border-radius:var(--r);padding:9px 18px;font-weight:600}
.save:hover{background:#17435a}
.daygroup{margin-bottom:24px}
.daygroup>h3{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.take{padding:12px 0 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:12px}
.take-body{flex:1;min-width:0}
.take-body p{margin:0;white-space:pre-wrap;max-width:72ch;line-height:1.6}
.take-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.tname{font-weight:600}
.texp{color:var(--bar);font-size:13px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line-soft);border-radius:100px;padding:1px 8px}
.del{background:none;border:0;color:var(--muted);padding:4px 8px;font-size:16px;line-height:1}
.del:hover{color:var(--qb)}
.empty{color:var(--muted);padding:30px 0;max-width:58ch}
.hidden{display:none !important}

/* ---------- mobile ---------- */
@media (max-width:720px){
  .wrap{padding:20px 14px 60px}
  h1{font-size:25px}
  .head-row{display:none}
  .row{
    grid-template-columns:32px 1fr 1fr 68px;
    grid-template-areas:
      "rank player player chev"
      "pos  teams  risk   bank";
    gap:8px 10px;padding:11px 6px;
  }
  .c-rank{text-align:left;padding-left:2px}
  .c-teams,.c-risk,.c-bank{text-align:left}
  .c-bank{text-align:right}
  .lbl{display:block}
  .detail{padding:0 6px 14px 42px}
  #teamList{grid-template-columns:1fr}
  .split{gap:22px;margin-top:24px}
  .chip{padding:6px 13px}
  .take-form input{min-width:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">

  <h1>Exposure Book <span>2026</span></h1>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="exp" aria-selected="true">Exposures</button>
    <button class="tab" role="tab" data-tab="teams" aria-selected="false">Teams</button>
    <button class="tab" role="tab" data-tab="takes" aria-selected="false">Takes</button>
  </nav>

  <section id="tab-exp">
    <div class="controls">
      <input class="field" id="search" placeholder="Find a player" style="min-width:170px">
      <div class="chipbar" id="posFilter"></div>
      <div class="chipbar" id="siteFilter"></div>
      <label class="toggle"><input type="checkbox" id="startersOnly"> Starting lineups only</label>
    </div>
    <div class="head-row">
      <span class="c-rank"></span>
      <button class="c-player" data-sort="name">Player</button>
      <span class="c-pos">Pos</span>
      <button class="c-teams" data-sort="teams">Teams</button>
      <button class="c-risk" data-sort="dollars">At risk</button>
      <button class="c-bank" data-sort="dollars">% of roll</button>
      <span class="c-chev"></span>
    </div>
    <div id="expList"></div>
    <div class="split">
      <div><h3>Position mix</h3><div id="byPos"></div><p class="note">Share of roster spots, weighted by buy-in.</p></div>
      <div><h3>Money by site</h3><div id="bySite"></div><p class="note">Actual dollars committed.</p></div>
      <div><h3>NFL team mix</h3><div id="byNfl"></div><p class="note" id="nflNote"></p></div>
    </div>
  </section>

  <section id="tab-teams" class="hidden"><div id="teamList"></div></section>

  <section id="tab-takes" class="hidden">
    <div class="take-form">
      <div class="grid">
        <input class="field" type="date" id="tkDate" style="flex:0 0 auto">
        <input class="field" id="tkPlayer" list="playerList" placeholder="Player (optional)">
        <datalist id="playerList"></datalist>
        <input class="field" id="tkTags" placeholder="Tags, comma separated">
      </div>
      <textarea id="tkText" placeholder="What's the take?"></textarea>
      <button class="save" id="btnSaveTake">Save take</button>
    </div>
    <div class="controls"><input class="field" id="tkSearch" placeholder="Search takes" style="min-width:220px"></div>
    <div id="takeList"></div>
    <p class="note" id="storeNote"></p>
  </section>

</div>

      bench:["QB|Patrick Mahomes|KC","RB|Keaton Mitchell|LAC","RB|Kaleb Johnson|GB","WR|Makai Lemon|PHI","WR|Khalil Shakir|BUF","WR|Denzel Boston|CLE","WR|Jauan Jennings|MIN","WR|Antonio Williams|WAS","TE|Kenyon Sadiq|NYJ","TE|AJ Barner|SEA"] },

/* ============================ helpers ============================ */
const POSITIONS=['QB','RB','WR','TE','K','DST'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=n=>'$'+Math.round(n).toLocaleString('en-US');
const pct=n=>{const v=n*100; return (Math.round(v*10)/10>=10?v.toFixed(0):v.toFixed(1))+'%';};
const uid=()=>Math.random().toString(36).slice(2,9);
const key=name=>String(name).toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g,'').replace(/[^a-z]/g,'');

const ALIAS={JAC:'JAX',WSH:'WAS',LA:'LAR',ARZ:'ARI'};
const canon=t=>ALIAS[t]||t;
const ESPN_SLUG={WAS:'wsh',LAR:'lar',LA:'lar',STL:'lar',OAK:'lv',SD:'lac',JAC:'jax',ARZ:'ari'};
function logo(code,size){
  const c=canon(String(code||'').replace(/[^A-Za-z]/g,'').toUpperCase());
  if(!c) return `<span class="tlogo blank" style="width:${size}px;height:${size}px"></span>`;
  const slug=(ESPN_SLUG[c]||c).toLowerCase();
  return `<img class="tlogo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png" alt="${esc(c)}" title="${esc(c)}"
    width="${size}" height="${size}" style="width:${size}px;height:${size}px" loading="lazy" decoding="async"
    onerror="this.style.visibility='hidden'">`;
}

function parseSeed(s,starter){ const [pos,name,nfl]=String(s).split('|'); return {pos:pos||'',name:name||'',nfl:nfl||'',starter}; }
function roster(t){
  return [].concat((t.starters||[]).map(s=>parseSeed(s,true)),(t.bench||[]).map(s=>parseSeed(s,false)));
}
const TEAMS=SEED.teams;
function bankroll(){ return TEAMS.reduce((a,t)=>a+(+t.buyin||0),0); }

/* takes are the only stored state */
const KEY='exposure-book-takes-v1';
let canPersist=true, memory=[];
function loadTakes(){
  try{ const raw=localStorage.getItem(KEY); return raw?JSON.parse(raw):[]; }
  catch(e){ canPersist=false; return memory; }
}
function saveTakes(){
  memory=takes;
  try{ localStorage.setItem(KEY,JSON.stringify(takes)); }
  catch(e){ canPersist=false; renderNote(); }
}
let takes=loadTakes();

/* ---- exposure math ---- */
function exposures(opts){
  opts=opts||{};
  const sites=opts.sites;
  const map=new Map();
  const pool=TEAMS.filter(t=>!sites||!sites.size||sites.has(t.site));
  pool.forEach(t=>{
    const seen=new Set();
    roster(t).forEach(p=>{
      if(opts.startersOnly && !p.starter) return;
      const k=key(p.name); if(!k) return;
      if(!map.has(k)) map.set(k,{name:p.name,pos:p.pos,nfl:p.nfl,teams:0,dollars:0,spots:[]});
      const e=map.get(k);
      if(p.nfl&&!e.nfl) e.nfl=p.nfl;
      if(p.pos&&!e.pos) e.pos=p.pos;
      if(!seen.has(k)){ seen.add(k); e.teams++; e.dollars+=(+t.buyin||0); }
      e.spots.push({site:t.site,label:t.label,buyin:+t.buyin||0,starter:p.starter});
    });
  });
  const cash=pool.reduce((a,t)=>a+(+t.buyin||0),0)||1;
  return [...map.values()].map(e=>({...e,pctBank:e.dollars/cash}));
}

/* ============================ rendering ============================ */
let ui={tab:'exp',pos:'ALL',sites:new Set(),sort:'dollars',dir:-1,q:'',startersOnly:false,tq:'',open:new Set()};

function renderNote(){
  $('#storeNote').textContent = canPersist
    ? 'Takes are saved in this browser. Send them over any time and I can bake them into the file so they follow you across devices.'
    : 'This browser is blocking local storage, so takes will not survive a reload here.';
}

function renderFilters(){
  $('#posFilter').innerHTML=['ALL',...POSITIONS].map(p=>
    `<button class="chip" data-pos="${p}" aria-pressed="${ui.pos===p}">${p==='ALL'?'All':p}</button>`).join('');
  const sites=[...new Set(TEAMS.map(t=>t.site))];
  const none=ui.sites.size===0;
  $('#siteFilter').innerHTML=
    `<button class="chip" data-site="ALL" aria-pressed="${none}">All sites</button>`+
    sites.map(s=>{
      const on=ui.sites.has(s);
      return `<button class="chip multi" data-site="${esc(s)}" aria-pressed="${on}">${on?'<span class="tick">✓</span>':''}${esc(s)}</button>`;
    }).join('');
}

function renderExposures(){
  let rows=exposures({sites:ui.sites,startersOnly:ui.startersOnly});
  if(ui.pos!=='ALL') rows=rows.filter(r=>r.pos===ui.pos);
  if(ui.q){ const q=ui.q.toLowerCase(); rows=rows.filter(r=>r.name.toLowerCase().includes(q)); }
  rows.sort((a,b)=>{
    const v = ui.sort==='name' ? a.name.localeCompare(b.name)
            : ui.sort==='teams' ? (a.teams-b.teams)||(a.dollars-b.dollars)
            : (a.dollars-b.dollars)||(a.teams-b.teams);
    return v*ui.dir;
  });
  const host=$('#expList');
  if(!rows.length){ host.innerHTML='<p class="empty">No players match those filters.</p>'; renderBreakdown(); return; }
  host.innerHTML=rows.map((r,i)=>{
    const k=key(r.name), open=ui.open.has(k);
    return `<div class="item${open?' open':''}" data-k="${esc(k)}">
      <button class="row" aria-expanded="${open}">
        <span class="c-rank">${i+1}</span>
        <span class="c-player">${logo(r.nfl,26)}<span class="pname">${esc(r.name)}<small>${esc(r.nfl||'—')}</small></span></span>
        <span class="c-pos"><span class="pos ${esc(r.pos)}">${esc(r.pos||'?')}</span></span>
        <span class="c-teams">${r.teams}<span class="lbl">teams</span></span>
        <span class="c-risk">${usd(r.dollars)}<span class="lbl">at risk</span></span>
        <span class="c-bank">${pct(r.pctBank)}<span class="lbl">of roll</span></span>
        <span class="c-chev">⌄</span>
      </button>
      <div class="detail">
        <div class="leagues">${r.spots.map(s=>`<span class="lg ${s.starter?'':'bench'}">${esc(s.label)}</span>`).join('')}</div>
        ${r.spots.some(s=>!s.starter)?'<p class="dnote">Dashed means bench.</p>':''}
      </div>
    </div>`;
  }).join('');
  renderBreakdown();
  $('#playerList').innerHTML=exposures({}).map(e=>`<option value="${esc(e.name)}">`).join('');
}

function renderBreakdown(){
  const all=exposures({});
  const byPos={}; all.forEach(e=>byPos[e.pos||'?']=(byPos[e.pos||'?']||0)+e.dollars);
  const posSum=Object.values(byPos).reduce((a,v)=>a+v,0)||1;
  const posMax=Math.max(1,...Object.values(byPos));
  $('#byPos').innerHTML=Object.entries(byPos).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`
    <div class="brow"><span><span class="pos ${esc(p)}">${esc(p)}</span></span>
      <span class="bar"><i style="width:${(v/posMax*100).toFixed(1)}%"></i></span>
      <span class="num">${pct(v/posSum)}</span></div>`).join('');

  const bySite={}; TEAMS.forEach(t=>bySite[t.site]=(bySite[t.site]||0)+(+t.buyin||0));
  const siteMax=Math.max(1,...Object.values(bySite));
  $('#bySite').innerHTML=Object.entries(bySite).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`
    <div class="brow"><span style="font-size:13px">${esc(s)}</span>
      <span class="bar"><i style="width:${(v/siteMax*100).toFixed(1)}%"></i></span>
      <span class="num">${usd(v)}</span></div>`).join('');

  const byNfl={}; all.forEach(e=>{ if(e.nfl) byNfl[e.nfl]=(byNfl[e.nfl]||0)+e.dollars; });
  const ranked=Object.entries(byNfl).sort((a,b)=>b[1]-a[1]);
  const nflSum=ranked.reduce((a,r)=>a+r[1],0)||1;
  const nflMax=Math.max(1,...ranked.map(r=>r[1]));
  $('#byNfl').innerHTML=ranked.slice(0,10).map(([t,v])=>`
    <div class="brow"><span style="display:flex;align-items:center;gap:7px;font-size:13px">${logo(t,20)}${esc(t)}</span>
      <span class="bar"><i style="width:${(v/nflMax*100).toFixed(1)}%"></i></span>
      <span class="num">${pct(v/nflSum)}</span></div>`).join('');
  $('#nflNote').textContent = ranked.length>10 ? `Top 10 of ${ranked.length} teams.` : '';
}

function renderTeams(){
  $('#teamList').innerHTML=TEAMS.map(t=>{
    const r=roster(t);
    const grp=(list,title,cls)=>list.length?`<div class="rgroup">${title}</div>`+list.map(p=>`
      <div class="slot ${cls}">
        <span class="pos ${esc(p.pos)}">${esc(p.pos||'?')}</span>
        ${logo(p.nfl,18)}
        <span class="nm">${esc(p.name)}</span>
      </div>`).join(''):'';
    return `<div class="team">
      <div class="team-hd">
        <h3>${esc(t.label)}</h3>
        <span class="meta">${usd(t.buyin)} buy-in at ${esc(t.site)}, ${r.length} players</span>
      </div>
      <div class="roster">
        ${grp(r.filter(p=>p.starter),'Starters','')}
        ${grp(r.filter(p=>!p.starter),'Bench','bn')}
      </div></div>`;
  }).join('');
}

function fmtDate(d){ const [y,m,dd]=d.split('-').map(Number);
  return new Date(y,m-1,dd).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }

function renderTakes(){
  const host=$('#takeList');
  let list=[...takes];
  if(ui.tq){ const q=ui.tq.toLowerCase();
    list=list.filter(t=>(t.text||'').toLowerCase().includes(q)||(t.player||'').toLowerCase().includes(q)||(t.tags||[]).join(' ').toLowerCase().includes(q)); }
  list.sort((a,b)=> b.date.localeCompare(a.date) || b.created-a.created);
  if(!list.length){ host.innerHTML='<p class="empty">Nothing logged yet. Write a take above and it gets stamped with the date so you can look back on it later.</p>'; renderNote(); return; }
  const expMap={}; exposures({}).forEach(e=>expMap[key(e.name)]=e);
  const days=[]; let cur=null;
  list.forEach(t=>{ if(!cur||cur.d!==t.date){cur={d:t.date,items:[]};days.push(cur);} cur.items.push(t); });
  host.innerHTML=days.map(d=>`
    <div class="daygroup"><h3>${fmtDate(d.d)}</h3>${d.items.map(t=>{
      const e=t.player?expMap[key(t.player)]:null;
      return `<div class="take"><div class="take-body">
        <div class="take-top">
          ${t.player?`<span class="tname">${esc(t.player)}</span>`:''}
          ${e?`<span class="texp">${usd(e.dollars)} on ${e.teams} team${e.teams>1?'s':''}</span>`:''}
          ${(t.tags||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}
        </div><p>${esc(t.text)}</p>
      </div><button class="del" data-deltake="${t.id}" title="Delete take">×</button></div>`;
    }).join('')}</div>`).join('');
  renderNote();
}

function renderAll(){ renderFilters(); renderExposures(); renderTeams(); renderTakes(); }

/* ============================ events ============================ */
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  ui.tab=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['exp','teams','takes'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==ui.tab));
}));
$('#posFilter').addEventListener('click',e=>{ if(!e.target.dataset.pos) return; ui.pos=e.target.dataset.pos; renderFilters(); renderExposures(); });
$('#siteFilter').addEventListener('click',e=>{
  const btn=e.target.closest('[data-site]'); if(!btn) return;
  const s=btn.dataset.site;
  if(s==='ALL') ui.sites.clear();
  else {
    ui.sites.has(s)?ui.sites.delete(s):ui.sites.add(s);
    // every site picked is the same view as none picked, so fall back to All
    if(ui.sites.size===new Set(TEAMS.map(t=>t.site)).size) ui.sites.clear();
  }
  renderFilters(); renderExposures();
});
$('#search').addEventListener('input',e=>{ ui.q=e.target.value; renderExposures(); });
$('#startersOnly').addEventListener('change',e=>{ ui.startersOnly=e.target.checked; renderExposures(); });
document.querySelectorAll('.head-row button[data-sort]').forEach(b=>b.addEventListener('click',()=>{
  const s=b.dataset.sort;
  if(ui.sort===s) ui.dir*=-1; else { ui.sort=s; ui.dir=(s==='name'?1:-1); }
  renderExposures();
}));
$('#expList').addEventListener('click',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  const item=row.closest('.item'), k=item.dataset.k;
  const open=!item.classList.contains('open');
  item.classList.toggle('open',open);
  row.setAttribute('aria-expanded',String(open));
  open?ui.open.add(k):ui.open.delete(k);
});

$('#tkDate').value=new Date().toLocaleDateString('en-CA');
$('#btnSaveTake').addEventListener('click',()=>{
  const text=$('#tkText').value.trim(); if(!text){ $('#tkText').focus(); return; }
  takes.push({id:uid(),date:$('#tkDate').value||new Date().toLocaleDateString('en-CA'),
    player:$('#tkPlayer').value.trim(),
    tags:$('#tkTags').value.split(',').map(s=>s.trim()).filter(Boolean),
    text,created:Date.now()});
  saveTakes(); $('#tkText').value=''; $('#tkPlayer').value=''; $('#tkTags').value=''; renderTakes();
});
$('#tkSearch').addEventListener('input',e=>{ ui.tq=e.target.value; renderTakes(); });
$('#takeList').addEventListener('click',e=>{
  const id=e.target.dataset.deltake; if(!id) return;
  if(confirm('Delete this take?')){ takes=takes.filter(t=>t.id!==id); saveTakes(); renderTakes(); }
});

renderAll();
</script>
</body>
</html>
